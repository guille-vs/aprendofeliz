server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca se cachea: es quien nombra los assets con hash. Si se queda
    # pegado en el navegador, después de desplegar seguiría pidiendo el bundle anterior.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Los assets de Astro llevan el hash en el nombre, así que un cambio genera
    # otro archivo y estos pueden cachearse indefinidamente.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
